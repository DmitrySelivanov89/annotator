<div class="viewer-container">
  <div class="viewer-header">
    <div class="viewer-header-left">
      <h2 class="article-title">{{ article().title }}</h2>
      <div class="article-meta">
        <span class="meta-date">{{ article().updatedAt | date : 'dd.MM.yyyy' }}</span>
        <span class="meta-separator">·</span>
        <span class="meta-annotations">
          {{ annotationCount() }} annotation{{ annotationCount() !== 1 ? 's' : '' }}
        </span>
      </div>
    </div>
    <div class="viewer-header-actions">
      <app-icon-button (clicked)="onEditArticle()" title="Edit article">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit
      </app-icon-button>
      <app-icon-button variant="danger-ghost" (clicked)="onDeleteArticle()" title="Delete article">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        Delete
      </app-icon-button>
    </div>
  </div>

  <app-annotation-hint/>

  <div class="viewer-body">
    <div
      #contentEl
      class="article-content"
      appHighlight
      [annotations]="annotations()"
      [content]="article().content"
      (annotationClick)="onHighlightClick($event)"
      (annotationHover)="onHighlightHover($event)"
      (annotationLeave)="onHighlightLeave()"
      (mouseup)="onMouseUp()"
    ></div>
  </div>

  <app-annotations-panel [annotations]="annotations()" (selectAnnotation)="selectChip($event)"/>
</div>

<app-annotation-tooltip [state]="tooltipState()"/>
